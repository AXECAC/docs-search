<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Docs Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1781384500">
</head>
<body>

    <header>
        <div class="logo">DocsSearch</div>
        <nav class="tab-nav" id="tab-nav" style="display: none;">
            <button class="tab-btn active" data-tab="dashboard">📁 Documents</button>
            <button class="tab-btn" data-tab="search">🔍 Search</button>
            <button class="tab-btn" data-tab="chat">💬 AI Chat</button>
            <button class="tab-btn admin-only" data-tab="groups" style="display:none;">👥 Groups</button>
        </nav>
        <div class="nav-actions" id="nav-actions">
            <!-- Dynamically populated -->
        </div>
    </header>

    <div class="container">
        <!-- Auth View -->
        <div id="auth-view" class="view active glass auth-container">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-control" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="auth-submit">Login</button>
            </form>
            <div class="auth-toggle" id="auth-toggle">Don't have an account? Register</div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <div class="dashboard-header">
                <h2>Your Documents</h2>
                <button class="btn btn-primary" id="open-upload-modal-btn">
                    + Upload File
                </button>
            </div>


            <div class="docs-grid" id="docs-grid">
                <!-- Documents injected here -->
            </div>
        </div>

        <!-- Search View -->
        <div id="search-view" class="view">
            <div class="dashboard-header">
                <h2>Search Documents</h2>
            </div>

            <form id="search-form" class="search-bar glass">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search your documents..."
                    autocomplete="off"
                >
                <button type="submit" class="btn btn-primary search-btn">Search</button>
            </form>

            <div id="search-state" class="search-state" style="display:none;"></div>
            <div id="search-results" class="search-results"></div>
        </div>

        <!-- Groups View (admin only) -->
        <div id="groups-view" class="view">
            <div class="dashboard-header">
                <h2>👥 Group Management</h2>
                <button class="btn btn-primary" id="create-group-btn">+ New Group</button>
            </div>
            <div id="groups-list" class="groups-list">
                <!-- Groups rendered here -->
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="view chat-view">
            <div class="dashboard-header" style="margin-bottom: 1rem;">
                <h2>AI Chat Assistant</h2>
            </div>
            
            <div class="chat-container glass">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-message assistant">
                        <div class="message-content">Здравствуйте! Я ваш ИИ-ассистент. Задайте мне вопрос по загруженным корпоративным документам.</div>
                    </div>
                </div>
                
                <form id="chat-form" class="chat-input-area">
                    <input 
                        type="text" 
                        id="chat-input" 
                        class="search-input" 
                        placeholder="Ask a question..." 
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="btn btn-primary search-btn" id="chat-submit-btn">Send</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Document Preview Modal -->
    <div id="doc-modal" class="doc-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="doc-modal-backdrop" onclick="closeDocModal()"></div>
        <div class="doc-modal-panel glass">
            <div class="doc-modal-header">
                <div class="doc-modal-title-wrap">
                    <span class="doc-modal-icon" id="modal-icon">📄</span>
                    <span class="doc-modal-title" id="modal-title">Document</span>
                </div>
                <div class="doc-modal-actions">
                    <a id="modal-download-btn" class="btn btn-outline" href="#" download>⬇ Download</a>
                    <button class="btn btn-outline" onclick="closeDocModal()">✕ Close</button>
                </div>
            </div>
            <div class="doc-modal-body" id="modal-body">
                <!-- iframe or download prompt injected here -->
            </div>
        </div>
    </div>

    <div id="upload-modal" class="doc-modal" style="display:none;"></div>
    <div id="group-modal" class="doc-modal" style="display:none;"></div>

    <script src="app.js?v=1781385600"></script>
</body>
</html>
