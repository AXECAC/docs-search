<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Docs Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        /* Views */
        .view {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auth Form */
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .auth-toggle {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .auth-toggle:hover {
            color: var(--primary);
        }

        /* Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .upload-area:hover, .upload-area.drag-over {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Documents Grid */
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .doc-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s ease;
        }

        .doc-card:hover {
            transform: translateY(-4px);
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .doc-title {
            font-weight: 600;
            font-size: 1.1rem;
            word-break: break-all;
        }

        .doc-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Toasts */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 1000;
        }

        .toast {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            animation: slideIn 0.3s ease forwards;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DocsSearch</div>
        <div class="nav-actions" id="nav-actions">
            <!-- Dynamically populated -->
        </div>
    </header>

    <div class="container">
        <!-- Auth View -->
        <div id="auth-view" class="view active glass auth-container">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-control" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="auth-submit">Login</button>
            </form>
            <div class="auth-toggle" id="auth-toggle">Don't have an account? Register</div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <div class="dashboard-header">
                <h2>Your Documents</h2>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    + Upload File
                </button>
            </div>

            <div class="upload-area glass" id="uploadArea">
                <div class="upload-icon">📄</div>
                <h3>Drag & Drop files here</h3>
                <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.875rem;">Supports PDF, DOCX, PPTX, XLSX, TXT, Images</p>
                <input type="file" id="fileInput" style="display: none;">
            </div>

            <div class="docs-grid" id="docs-grid">
                <!-- Documents injected here -->
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        // State
        let state = {
            isAuthenticated: false,
            isLoginMode: true,
            user: null,
            documents: []
        };

        // DOM Elements
        const views = {
            auth: document.getElementById('auth-view'),
            dashboard: document.getElementById('dashboard-view')
        };
        const navActions = document.getElementById('nav-actions');
        
        // --- Utility: Toasts ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Utility: API Fetch with Interceptor ---
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = { ...options.headers };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            // Do not set Content-Type if body is FormData
            if (!(options.body instanceof FormData) && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            try {
                let response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
                
                // Handle token expiration / 401
                if (response.status === 401 && token) {
                    const refreshed = await refreshToken();
                    if (refreshed) {
                        headers['Authorization'] = `Bearer ${localStorage.getItem('access_token')}`;
                        response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
                    } else {
                        logout();
                        throw new Error("Session expired. Please login again.");
                    }
                }

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ detail: response.statusText }));
                    throw new Error(err.detail || "API Error");
                }

                return await response.json();
            } catch (error) {
                showToast(error.message, 'error');
                throw error;
            }
        }

        // --- Auth Functions ---
        async function refreshToken() {
            const refresh = localStorage.getItem('refresh_token');
            if (!refresh) return false;
            try {
                const res = await fetch(`${API_URL}/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refresh })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            state.isAuthenticated = false;
            state.user = null;
            render();
        }

        async function checkAuth() {
            if (localStorage.getItem('access_token')) {
                try {
                    state.user = await apiFetch('/auth/me');
                    state.isAuthenticated = true;
                } catch(e) {
                    logout();
                }
            }
            render();
        }

        // --- Document Functions ---
        async function fetchDocuments() {
            try {
                state.documents = await apiFetch('/documents');
                renderDocuments();
            } catch(e) { console.error(e); }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            showToast('Uploading...', 'success');
            try {
                await apiFetch('/documents/upload', {
                    method: 'POST',
                    body: formData
                });
                showToast('File uploaded successfully!');
                fetchDocuments();
            } catch(e) {
                console.error(e);
            }
        }

        async function deleteDocument(id) {
            if(!confirm("Are you sure you want to delete this document?")) return;
            try {
                await apiFetch(`/documents/${id}`, { method: 'DELETE' });
                showToast('Document deleted');
                fetchDocuments();
            } catch(e) { console.error(e); }
        }

        // --- Event Listeners ---
        document.getElementById('auth-toggle').addEventListener('click', () => {
            state.isLoginMode = !state.isLoginMode;
            document.getElementById('auth-title').innerText = state.isLoginMode ? 'Login' : 'Register';
            document.getElementById('auth-submit').innerText = state.isLoginMode ? 'Login' : 'Create Account';
            document.getElementById('auth-toggle').innerText = state.isLoginMode ? "Don't have an account? Register" : "Already have an account? Login";
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('auth-submit');
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                if (state.isLoginMode) {
                    // Login uses OAuth2 Form
                    const fd = new FormData();
                    fd.append('username', username);
                    fd.append('password', password);
                    const data = await fetch(`${API_URL}/auth/login`, { method: 'POST', body: fd }).then(async r => {
                        if(!r.ok) throw new Error((await r.json()).detail);
                        return r.json();
                    });
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                } else {
                    // Register
                    await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    }).then(async r => {
                        if(!r.ok) throw new Error((await r.json()).detail);
                    });
                    showToast("Registered successfully. Please login.");
                    state.isLoginMode = true;
                    render();
                    btn.innerHTML = 'Login';
                    btn.disabled = false;
                    return;
                }
                
                await checkAuth();
                showToast(`Welcome, ${state.user.username}!`);
            } catch(e) {
                showToast(e.message, 'error');
            } finally {
                btn.innerHTML = state.isLoginMode ? 'Login' : 'Create Account';
                btn.disabled = false;
            }
        });

        // Drag & Drop
        const dropArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('drag-over'), false);
        });

        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if(files.length) uploadFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length) uploadFile(e.target.files[0]);
        });

        // --- Render ---
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function renderDocuments() {
            const grid = document.getElementById('docs-grid');
            if(state.documents.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">No documents found.</p>';
                return;
            }
            
            grid.innerHTML = state.documents.map(doc => `
                <div class="doc-card glass">
                    <div class="doc-header">
                        <div class="doc-title">${doc.title || 'Untitled'}</div>
                        <span class="badge">${doc.extension ? doc.extension.toUpperCase() : 'UNKNOWN'}</span>
                    </div>
                    <div class="doc-meta">
                        <span>Size: ${formatBytes(doc.size_bytes)}</span>
                        <span>Date: ${new Date(doc.upload_date).toLocaleDateString()}</span>
                    </div>
                    <div style="margin-top: auto; display: flex; gap: 0.5rem; justify-content: flex-end;">
                        ${(state.user.role === 'admin' || state.user.id === doc.uploader_id) ? 
                            `<button class="btn btn-danger" onclick="deleteDocument('${doc.id}')">Delete</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function render() {
            if (state.isAuthenticated) {
                views.auth.classList.remove('active');
                views.dashboard.classList.add('active');
                navActions.innerHTML = `
                    <span class="badge" style="background: rgba(99, 102, 241, 0.2); color: #818cf8;">
                        ${state.user.role.toUpperCase()}
                    </span>
                    <span>${state.user.username}</span>
                    <button class="btn btn-outline" onclick="logout()">Logout</button>
                `;
                fetchDocuments();
            } else {
                views.dashboard.classList.remove('active');
                views.auth.classList.add('active');
                navActions.innerHTML = '';
            }
        }

        // Init
        checkAuth();
    </script>
</body>
</html>
